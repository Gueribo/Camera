<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Framecraft Camera</title>
<meta name="theme-color" content="#121210">
<meta name="description" content="Live camera viewfinder with composition guides.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <main id="stageArea">
    <div class="viewport" id="viewport">
      <video id="video" autoplay playsinline muted></video>
      <canvas class="guide-canvas" id="guideCanvas"></canvas>
      <div class="flash" id="flash"></div>
      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="bracket bl"></div>
      <div class="bracket br"></div>
    </div>

    <div class="state-overlay" id="stateOverlay">
      <p id="stateMessage">Démarrage de la caméra…</p>
      <button id="stateRetry">Réessayer</button>
    </div>
  </main>

  <!-- floating top bar: quick toggles that open a menu sheet -->
  <div class="float-bar top-bar">
    <div class="brand-mini"><span class="dot"></span></div>
    <div class="top-tools">
      <button class="menu-toggle" id="aspectToggle" data-sheet="aspectSheet">
        <span class="menu-toggle-label mono" id="aspectLabel">Plein</span>
      </button>
      <button class="menu-toggle" id="guideToggle" data-sheet="guideSheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="9.5" y1="3" x2="9.5" y2="21"/><line x1="14.5" y1="3" x2="14.5" y2="21"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="3" y1="14.5" x2="21" y2="14.5"/></svg>
        <span class="menu-toggle-label" id="guideLabel">Thirds</span>
      </button>
      <button class="menu-toggle" id="styleToggle" data-sheet="styleSheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="menu-toggle icon-only" id="includeGuidesBtn" title="Inclure les guides sur la photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      </button>
    </div>
    <button class="install-pill" id="installBtn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      Installer
    </button>
  </div>

  <!-- floating bottom bar -->
  <div class="float-bar bottom-bar">
    <button class="round-btn thumb-btn" id="lastShotBtn" disabled title="Dernière photo">
      <img id="previewThumb" alt="Dernière photo">
      <svg class="thumb-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.2"/><path d="M8 6l1.6-2.4h4.8L16 6"/></svg>
    </button>
    <button class="shutter" id="shutter" title="Prendre la photo"></button>
    <button class="round-btn" id="switchCam" title="Changer de caméra">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 12v-2a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>

  <!-- scrim behind any open sheet -->
  <div class="scrim" id="scrim"></div>

  <!-- menu sheets -->
  <div class="sheet" id="guideSheet">
    <div class="sheet-title">Guide de composition</div>
    <div class="chip-row">
      <button class="chip active" data-guide="thirds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="20" height="20"/><line x1="9" y1="2" x2="9" y2="22"/><line x1="15" y1="2" x2="15" y2="22"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="2" y1="15" x2="22" y2="15"/></svg>
        Thirds
      </button>
      <button class="chip" data-guide="phi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="20" height="20"/><line x1="9.6" y1="2" x2="9.6" y2="22"/><line x1="14.4" y1="2" x2="14.4" y2="22"/><line x1="2" y1="9.6" x2="22" y2="9.6"/><line x1="2" y1="14.4" x2="22" y2="14.4"/></svg>
        Phi
      </button>
      <button class="chip" data-guide="spiral">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M20 12a8 8 0 1 1-8-8"/><path d="M12 4a5 5 0 1 1-5 5"/><path d="M7 9a2.6 2.6 0 1 1 2.6 2.6"/></svg>
        Spirale
      </button>
      <button class="chip" data-guide="diagonal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="20" height="20"/><line x1="2" y1="2" x2="22" y2="22"/><line x1="22" y1="2" x2="12" y2="12"/><line x1="2" y1="22" x2="12" y2="12"/></svg>
        Diagonales
      </button>
      <button class="chip" data-guide="symmetry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="20" height="20"/><line x1="12" y1="2" x2="12" y2="22" stroke-dasharray="2 2"/><line x1="2" y1="12" x2="22" y2="12" stroke-dasharray="2 2"/></svg>
        Symétrie
      </button>
      <button class="chip" data-guide="frame">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="20" height="20"/><rect x="6" y="6" width="12" height="12"/><line x1="12" y1="10.5" x2="12" y2="13.5"/><line x1="10.5" y1="12" x2="13.5" y2="12"/></svg>
        Cadre
      </button>
      <button class="chip" data-guide="none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="20" height="20"/><line x1="4" y1="20" x2="20" y2="4"/></svg>
        Aucun
      </button>
    </div>
    <div class="orient-row" id="orientRow">
      <span class="sheet-sublabel">Angle de la spirale</span>
      <div class="orient-btns">
        <button class="orient-btn active" data-orient="0" title="Œil en bas à droite">↘</button>
        <button class="orient-btn" data-orient="1" title="Œil en bas à gauche">↙</button>
        <button class="orient-btn" data-orient="2" title="Œil en haut à droite">↗</button>
        <button class="orient-btn" data-orient="3" title="Œil en haut à gauche">↖</button>
      </div>
    </div>
  </div>

  <div class="sheet" id="aspectSheet">
    <div class="sheet-title">Format d'image</div>
    <div class="chip-row">
      <button class="chip active" data-aspect="full">Plein écran</button>
      <button class="chip" data-aspect="1:1">1:1</button>
      <button class="chip" data-aspect="4:3">4:3</button>
      <button class="chip" data-aspect="3:2">3:2</button>
      <button class="chip" data-aspect="16:9">16:9</button>
    </div>
  </div>

  <div class="sheet" id="styleSheet">
    <div class="sheet-title">Style des lignes</div>
    <div class="style-row">
      <div class="swatch-row">
        <button class="swatch active" data-color="#e8a33d" style="background:#e8a33d"></button>
        <button class="swatch" data-color="#f4f1ea" style="background:#f4f1ea"></button>
        <button class="swatch" data-color="#e2543a" style="background:#e2543a"></button>
      </div>
      <div class="opacity-control">
        <span class="sheet-sublabel">Opacité</span>
        <input type="range" id="opacitySlider" min="20" max="100" value="85">
      </div>
    </div>
  </div>

  <div class="sheet" id="previewSheet">
    <div class="sheet-title">Photo capturée</div>
    <div class="preview-row">
      <img class="preview-large" id="previewLarge" alt="Photo capturée">
      <div class="preview-actions">
        <a class="link-btn" id="downloadLink" download="framecraft-photo.jpg">Télécharger</a>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
